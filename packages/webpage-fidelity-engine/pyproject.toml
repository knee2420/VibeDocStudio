[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webpage-fidelity-engine"
version = "0.1.0"
description = "Host-independent web page DOM/CSS extractor, site profile normalizer, height/section paginator, and .vdoc assembler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
browser = [
    "websocket-client>=1.7.0",
]

[project.scripts]
webpage-fidelity = "webpage_fidelity_engine.cli:main"

[tool.setuptools.packages.find]
include = ["webpage_fidelity_engine*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


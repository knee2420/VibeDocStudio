[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-vdoc-engine"
version = "0.1.0"
description = "Host-independent deterministic PDF-to-.vdoc 4-stage extraction engine (measure -> judge -> assemble -> validate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
]

[project.scripts]
pdf-vdoc-engine = "pdf_vdoc_engine.cli:main"


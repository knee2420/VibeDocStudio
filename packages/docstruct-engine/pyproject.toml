[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docstruct-engine"
version = "0.1.0"
description = "Host-independent document structure recovery engine (PageIR / DocIR, invariant checks, HTML/IR reconcile, TEDS/NED verification)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pdf-fidelity-engine",
    "pdf-vdoc-engine",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "../pdf-fidelity-engine",
    "../pdf-vdoc-engine",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["docstruct_engine*"]


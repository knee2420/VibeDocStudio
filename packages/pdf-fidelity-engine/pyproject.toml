[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-fidelity-engine"
version = "0.1.0"
description = "Host-independent PDF char-normalization, dashed-table grid, slot HTML emitter, and visual fidelity engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
metrics = [
    "fonttools>=4.50.0",
]
verify = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "scipy>=1.12.0",
    "pypdfium2>=4.25.0",
    "websocket-client>=1.7.0",
]

[project.scripts]
pdf-fidelity = "pdf_fidelity_engine.cli:main"

[tool.setuptools.packages.find]
include = ["pdf_fidelity_engine*"]


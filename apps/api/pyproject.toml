[project]
name = "vibe-doc-studio-api"
version = "0.2.0"
description = "VibeDocStudio Hexagonal Domain-Sliced API (resource · reference · documents · authoring · assistant · llm 게이트웨이)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "dependency-injector>=4.42.0",
    "pdf-vdoc-engine",
    "agent-core",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/pdf-vdoc-engine", "../../packages/agent-core", "../../packages/harness-kit"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.importlinter]
root_packages = ["app", "harness_kit", "pdf_vdoc_engine", "vibefs"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import domains"
type = "forbidden"
source_modules = [
    "app.core",
]
forbidden_modules = [
    "app.assistant",
    "app.authoring",
    "app.catalog",
    "app.documents",
    "app.form_scaffold",
    "app.projects",
    "app.reference",
    "app.resource",
    "app.llm",
]

[[tool.importlinter.contracts]]
name = "LLM gateway must not import domains"
type = "forbidden"
source_modules = [
    "app.llm",
]
forbidden_modules = [
    "app.assistant",
    "app.authoring",
    "app.catalog",
    "app.documents",
    "app.form_scaffold",
    "app.projects",
    "app.reference",
    "app.resource",
]

[[tool.importlinter.contracts]]
name = "Domain cores know only LLM ports, not concrete runners"
type = "forbidden"
source_modules = [
    "app.assistant.use_cases",
    "app.assistant.workspace.service",
    "app.authoring.agents",
    "app.authoring.use_cases",
    "app.catalog.use_cases",
    "app.documents.use_cases",
    "app.form_scaffold.agents",
    "app.form_scaffold.use_cases",
    "app.projects.use_cases",
    "app.reference.use_cases",
    "app.resource.backdata.use_cases",
    "app.resource.index.use_cases",
    "app.resource.ledger.use_cases",
]
forbidden_modules = [
    "app.llm.adapters",
]

[[tool.importlinter.contracts]]
name = "Pdf VDoc Engine is independent"
type = "forbidden"
source_modules = [
    "pdf_vdoc_engine",
]
forbidden_modules = [
    "app.assistant",
    "app.authoring",
    "app.catalog",
    "app.documents",
    "app.form_scaffold",
    "app.projects",
    "app.reference",
    "app.resource",
    "app.core",
    "app.llm",
    "app.bootstrap",
    "vibefs",
]

[[tool.importlinter.contracts]]
name = "Storage paths are known only to adapters and bootstrap"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.*.use_cases",
    "app.*.agents",
]
forbidden_modules = [
    "app.core.config",
]

[[tool.importlinter.contracts]]
name = "Routers do not import the composition root"
type = "forbidden"
source_modules = [
    "app.*.router",
]
forbidden_modules = [
    "app.bootstrap",
]

[[tool.importlinter.contracts]]
name = "assistant must not depend on other domains"

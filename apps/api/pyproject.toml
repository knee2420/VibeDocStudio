[project]
name = "vibe-doc-studio-api"
version = "0.2.0"
description = "VibeDocStudio Hexagonal Domain-Sliced API (catalog · documents · backdata · composer · projects)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "dependency-injector>=4.42.0",
    "pdf-vdoc-engine",
    "agent-core",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/pdf-vdoc-engine", "../../packages/agent-core"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.importlinter]
root_packages = ["app", "pdf_vdoc_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import domains"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.assistant",
    "app.knowledge",
    "app.resources",
    "app.backdata",
    "app.catalog",
    "app.composer",
    "app.documents",
    "app.projects",
    "app.runtime",
]

[[tool.importlinter.contracts]]
name = "Pdf VDoc Engine is independent"
type = "forbidden"
source_modules = ["pdf_vdoc_engine"]
forbidden_modules = [
    "app.assistant",
    "app.backdata",
    "app.catalog",
    "app.composer",
    "app.documents",
    "app.projects",
    "app.runtime",
    "app.core",
    "app.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Storage paths are known only to adapters and bootstrap"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.*.use_cases",
    "app.*.agents",
]
forbidden_modules = ["app.core.config"]

[[tool.importlinter.contracts]]
name = "Routers do not import the composition root"
type = "forbidden"
source_modules = ["app.*.router"]
forbidden_modules = ["app.bootstrap"]

[[tool.importlinter.contracts]]
name = "backdata must not depend on other domains"
type = "forbidden"
source_modules = [
    "app.backdata.use_cases",
    "app.backdata.adapters",
    "app.backdata.ports",
]
forbidden_modules = [
    "app.assistant",
